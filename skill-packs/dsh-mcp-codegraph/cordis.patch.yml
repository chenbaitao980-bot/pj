# dsh-mcp-codegraph · 冻结版内置 MCP + 自动初始化
# 安装器会把 __FROZEN_NODE__ / __FROZEN_VENDOR__ 换成本机绝对路径；
# 手工改配置时保留这两个占位符以外的内容即可。
- insert:
    # 插件本体：会话第一步注入 codegraph_explore 用法，并在缺 .codegraph/ 时后台建索引
    - id: dsh-mcp-codegraph
      name: dsh-mcp-codegraph
      config:
        enabled: true
        autoInit: true
        vendorDir: "__FROZEN_VENDOR__"
        nodePath: "__FROZEN_NODE__"
    # MCP 服务：codegraph_explore
    - id: mcp-codegraph
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        transport: stdio
        serverName: codegraph
        command: "__FROZEN_NODE__"
        args:
          - "__FROZEN_VENDOR__/codegraph/npm-shim.js"
          - serve
          - --mcp
        env: {}
        cwd: ""
        failOnStartupError: false
        toolCallTimeoutMs: 120000
