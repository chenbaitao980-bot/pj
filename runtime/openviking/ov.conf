{
    "service_name":  "openviking-server",
    "server":  {
                   "host":  "127.0.0.1",
                   "port":  1933
               },
    "storage":  {
                    "workspace":  "./data",
                    "vectordb":  {
                                     "name":  "context",
                                     "backend":  "local"
                                 },
                    "agfs":  {
                                 "backend":  "local"
                             }
                },
    "embedding":  {
                      "dense":  {
                                    "provider":  "local",
                                    "model":  "bge-small-zh-v1.5-f16",
                                    "dimension":  512,
                                    "cache_dir":  "./models"
                                }
                  },
    "vlm":  {
                "provider":  "openai",
                "model":  "dsh-current",
                "api_key":  "local",
                "api_base":  "http://127.0.0.1:8082/v1",
                "max_tokens":  3072,
                "temperature":  0.1
            },
    "memory":  {
                   "extraction_enabled":  true,
                   "extraction_output_format":  "python"
               },
    "user_config_defaults":  {
                                 "memory_policy":  {
                                                       "memory_types":  [
                                                                            "preferences",
                                                                            "profile"
                                                                        ]
                                                   }
                             }
}